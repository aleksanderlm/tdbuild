name: Windows Build from Upstream to Releases

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 Build
    runs-on: windows-2022

    env:
      PATCH_URL: "https://raw.githubusercontent.com/aleksanderlm/tdbuild/refs/heads/main/clean.patch"
      UPSTREAM_REPO: "https://github.com/telegramdesktop/tdesktop.git"
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      TDESKTOP_BUILD_ARCH: "x64"
      TDESKTOP_BUILD_GENERATOR: ""
      TDESKTOP_BUILD_DEFINE: "-D CMAKE_CXX_FLAGS=-DTDESKTOP_DISABLE_AUTOUPDATE"
      TDESKTOP_BUILD_API: "-D TDESKTOP_API_TEST=ON"
      ARTIFACT_NAME: "Telegram_x64"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%

      - uses: Eden-CI/msvc-dev-cmd@master
        name: MSVC Dev Cmd
        with:
          arch: x64

      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Clone upstream tdesktop
        run: |
          git clone --recursive %UPSTREAM_REPO% %TBUILD%\tdesktop

      - name: Set up Git config
        run: |
          git config --global user.email "actions@example.com"
          git config --global user.name "GitHub Actions"

      - name: Download patch
        run: curl -L %PATCH_URL% -o %TBUILD%\patch.patch

      - name: Apply patch
        run: |
          cd %TBUILD%\tdesktop
          git apply --check %TBUILD%\patch.patch
          if errorlevel 1 exit /b 1
          git apply %TBUILD%\patch.patch

      - name: Inject windowsapp.lib into Telegram CMakeLists
        run: |
          cd %TBUILD%\tdesktop
          echo.>> Telegram\CMakeLists.txt
          echo if (WIN32)>> Telegram\CMakeLists.txt
          echo   target_link_libraries(Telegram PRIVATE windowsapp)>> Telegram\CMakeLists.txt
          echo endif()>> Telegram\CMakeLists.txt

      - name: Fix libvpx nasm bug (Patch prepare scripts)
        shell: python
        run: |
          import os
          import glob

          # Мы не можем патчить sh-скрипт, потому что его еще нет. 
          # Зато мы можем пропатчить питон-скрипт сборщика, чтобы он сам вызвал pacman перед сборкой libvpx.
          tbuild = os.environ.get('TBUILD', '')
          search_pattern = os.path.join(tbuild, 'tdesktop', 'Telegram', 'build', 'prepare', '**', '*.py')
          
          target_str = 'bash --login ../patches/build_libvpx_win.sh'
          replacement_str = 'bash -l -c "pacman -U --noconfirm https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-nasm-2.16.03-1-any.pkg.tar.zst" && bash --login ../patches/build_libvpx_win.sh'
          
          for filepath in glob.glob(search_pattern, recursive=True):
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              if target_str in content:
                  print(f"Patching {filepath}...")
                  content = content.replace(target_str, replacement_str)
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(content)

      - name: Generate cache key
        shell: bash
        run: echo "CACHE_KEY=$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Libraries
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          GYP_MSVS_VERSION: 2022
        run: |
          cd %TBUILD%
          tdesktop\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space
        run: |
          cd %TBUILD%
          del /S Libraries\*.pdb
          del /S Libraries\*.pch
          del /S Libraries\*.obj

      - name: Telegram Desktop build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\tdesktop\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Release --parallel

      - name: Move artifact
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\tdesktop\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact\
          

      - uses: actions/upload-artifact@v4
        name: Upload artifact
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\

      - name: Create release tag
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        shell: bash
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          cd self
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Telegram Desktop ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/nightly' }}
          files: |
            artifact/Telegram.exe
            artifact/Updater.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
